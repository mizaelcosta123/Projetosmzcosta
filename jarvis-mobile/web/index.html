<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#04060b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jarvis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <!-- Futuristic chrome, purely decorative and marked aria-hidden. The reticle
       rings, corner brackets and scanline are static CSS; hud.js only feeds the
       live telemetry and the state reaction. -->
  <div class="hud" id="hud" aria-hidden="true" data-state="idle">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
    <span class="scanline"></span>

    <svg class="reticle" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
      <circle class="ring ring-static" cx="200" cy="200" r="150" />
      <circle class="ring ring-spin" cx="200" cy="200" r="176" stroke-dasharray="6 20" />
      <circle class="ring ring-spin-rev" cx="200" cy="200" r="128" stroke-dasharray="2 14" />
      <path class="arc arc-a" d="M200 30 A170 170 0 0 1 370 200" />
      <path class="arc arc-b" d="M200 370 A170 170 0 0 1 30 200" />
      <g class="ticks">
        <line x1="200" y1="24" x2="200" y2="40" />
        <line x1="200" y1="360" x2="200" y2="376" />
        <line x1="24" y1="200" x2="40" y2="200" />
        <line x1="360" y1="200" x2="376" y2="200" />
      </g>
    </svg>

    <div class="telemetry" id="telemetry"></div>
    <p class="hud-mode" id="hud-mode">EM REPOUSO</p>
  </div>

  <!-- The frame stays out of the way: he is the interface, not the chrome
       around him. Controls sit at the edges, dim until touched. -->
  <header class="frame">
    <button id="menu" class="ghost-btn" aria-label="Configurações" aria-haspopup="dialog">
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M3 6h14M3 10h14M3 14h10" />
      </svg>
    </button>

    <!-- State lives in the field itself — still, breathing, or speaking. This
         carries it for anyone who cannot see the field, and surfaces visually
         only when something went wrong. -->
    <p id="status" class="state" role="status" aria-live="polite">em repouso</p>

    <button id="shape" class="ghost-btn" aria-label="Alternar entre esfera e rosto" title="Alternar forma">
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <circle cx="10" cy="10" r="6.5" />
      </svg>
    </button>
  </header>

  <!-- The active agent's callsign and specialty, sitting just under the frame. -->
  <div class="callsign" id="callsign" aria-live="polite">
    <span class="callsign-name" id="callsign-name">JARVIS</span>
    <span class="callsign-role" id="callsign-role">Orquestrador</span>
  </div>

  <!-- The roster: pick which agent holds the field. -->
  <nav class="dock" id="dock" role="tablist" aria-label="Agentes"></nav>

  <p id="caption" class="caption" aria-live="polite"></p>

  <form id="composer" class="composer" autocomplete="off">
    <input id="prompt" type="text" placeholder="Fale com ele" aria-label="Mensagem" enterkeyhint="send">
    <button id="send" type="submit" aria-label="Enviar">
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M3 10h13M11 5l5 5-5 5" />
      </svg>
    </button>
  </form>

  <dialog id="settings" class="sheet" aria-label="Configurações">
    <form method="dialog">
      <h2>Conexão</h2>

      <label for="server-url">Servidor</label>
      <input id="server-url" type="url" inputmode="url" placeholder="http://localhost:8000">

      <label for="api-key">Chave de API</label>
      <input id="api-key" type="password" placeholder="opcional">

      <label for="model">Modelo</label>
      <!-- A datalist, not a select: the free catalogue is a convenience, and
           any model ID must stay typeable whether or not it is listed. -->
      <input id="model" type="text" list="model-options" placeholder="padrão do servidor" autocapitalize="off" spellcheck="false">
      <datalist id="model-options"></datalist>
      <p class="hint" id="model-hint"></p>

      <label class="switch">
        <input id="speak" type="checkbox" checked>
        <span>Falar as respostas em voz alta</span>
      </label>
      <p class="hint" id="voice-mode"></p>

      <menu>
        <button value="demo" id="demo-btn" class="quiet">Ver sem servidor</button>
        <button value="save" id="save-btn">Salvar</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
