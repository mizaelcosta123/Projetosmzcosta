<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#04060b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jarvis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <!-- The frame stays out of the way: he is the interface, not the chrome
       around him. Controls sit at the edges, dim until touched. -->
  <header class="frame">
    <button id="menu" class="ghost-btn" aria-label="Configurações" aria-haspopup="dialog">
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M3 6h14M3 10h14M3 14h10" />
      </svg>
    </button>

    <!-- State lives in the field itself — still, breathing, or speaking. This
         carries it for anyone who cannot see the field, and surfaces visually
         only when something went wrong. -->
    <p id="status" class="state" role="status" aria-live="polite">em repouso</p>

    <button id="shape" class="ghost-btn" aria-label="Alternar entre esfera e rosto" title="Alternar forma">
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <circle cx="10" cy="10" r="6.5" />
      </svg>
    </button>
  </header>

  <p id="caption" class="caption" aria-live="polite"></p>

  <form id="composer" class="composer" autocomplete="off">
    <input id="prompt" type="text" placeholder="Fale com ele" aria-label="Mensagem" enterkeyhint="send">
    <button id="send" type="submit" aria-label="Enviar">
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M3 10h13M11 5l5 5-5 5" />
      </svg>
    </button>
  </form>

  <dialog id="settings" class="sheet" aria-label="Configurações">
    <form method="dialog">
      <h2>Conexão</h2>

      <label for="server-url">Servidor</label>
      <input id="server-url" type="url" inputmode="url" placeholder="http://localhost:8000">

      <label for="api-key">Chave de API</label>
      <input id="api-key" type="password" placeholder="opcional">

      <label for="model">Modelo</label>
      <input id="model" type="text" placeholder="padrão do servidor">

      <label class="switch">
        <input id="speak" type="checkbox" checked>
        <span>Falar as respostas em voz alta</span>
      </label>
      <p class="hint" id="voice-mode"></p>

      <menu>
        <button value="demo" id="demo-btn" class="quiet">Ver sem servidor</button>
        <button value="save" id="save-btn">Salvar</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
