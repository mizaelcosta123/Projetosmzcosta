# Server config for the container. Everything here can be overridden by an
# environment variable at run time, which is how a host without a shell does it.

[intelligence]
# Grok, through xAI's own API (https://api.x.ai/v1, key in XAI_API_KEY). A
# fixed id rather than a router, so the answers keep one character from turn
# to turn. It is paid by the token: the console at https://console.x.ai needs
# credits before the first answer, and a key with none answers 403.
#
# OpenRouter stays registered as the alternative. With OPENROUTER_API_KEY set
# and this engine switched back to "openrouter" (default_model
# "openrouter/auto" always works there), nothing else has to change.
#
# Whichever engine runs, the model is also chosen per device in
# Configuracoes -> Modelo in the app, and that choice beats this file.
#
# When it was OpenRouter's free tier, two failures needed different fixes:
#
#   "model not found"  -- the id was renamed or retired; free slugs come and go.
#   404 with "guardrail" or "data policy" in the body -- the id is real, but
#       every provider serving it was excluded by the account's own rules.
#       A ":free" model is usually served by a single provider, and that
#       provider is usually one a default data policy excludes, so the two
#       coincide often. The switch is at
#       https://openrouter.ai/workspaces/default/guardrails -- nothing in this
#       repository can change it. The way out needs no redeploy: pick another
# model in Configuracoes -> Modelo in the app itself. That choice is per device,
# it is sent with every request, and it beats whatever is written here.
# "openrouter/auto" always works and is the fallback worth knowing.
#
# This file is baked into the image (see deploy/Dockerfile), so changing the
# line below means a rebuild and a Manual Deploy. The app's own setting does
# not.
default_model = "grok-4.7"
preferred_engine = "xai"

[engine]
default = "xai"

[agent]
default_agent = "orchestrator"
max_turns = 8
# No shell or filesystem tools *for the server*: a container reachable from the
# internet should not be able to run commands on itself.
#
# The device_* tools are a different thing. They do nothing at all unless a
# phone has linked itself over the bridge (JARVIS_DEVICE_TOKEN), they execute
# on that phone and never here, and the runner on the device decides what it
# will accept. Two of those decisions have to be typed on the phone itself:
# device_shell needs --allow-shell, and the screen tools (tap, swipe, type,
# ui_dump, screenshot) need --allow-ui, because `input tap` can press any
# button on somebody's phone. Without a linked phone every one of them answers
# "nenhum aparelho conectado".
#
# device_permissions is the one to reach for first when a device tool fails for
# no clear reason: Android does not report a denied permission as one.
tools = "think,calculator,web_search,device_open,device_app_launch,device_notify,device_clipboard,device_share,device_status,device_permissions,device_screen_size,device_ui_dump,device_screenshot,device_tap,device_swipe,device_type,device_key,device_photo,device_camera_info,device_write,device_list,device_packages,device_wifi,device_telephony,device_sensors,device_volume,device_contacts,device_location,device_torch_on,device_torch_off,device_shell,device_read,set_display_mode,conjure,speak"
context_from_memory = false

[tools.storage]
default_backend = "sqlite"
db_path = "/data/.openjarvis/memory.db"

[learning]
enabled = false

[telemetry]
enabled = false
gpu_metrics = false

[traces]
enabled = true
db_path = "/data/.openjarvis/traces.db"

[server]
host = "0.0.0.0"
port = 8000
