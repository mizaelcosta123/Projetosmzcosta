# Server config for the container. Everything here can be overridden by an
# environment variable at run time, which is how a host without a shell does it.

[intelligence]
# The dedicated model, as asked for. It is a free tier, so it costs nothing to
# leave running, and it is a fixed id rather than the auto router: the answers
# stay consistent from one turn to the next instead of changing character when
# the router changes its mind.
#
# If OpenRouter rejects this id ("model not found"), the id has been renamed or
# retired -- free slugs come and go. The way out needs no redeploy: pick another
# model in Configuracoes -> Modelo in the app itself. That choice is per device,
# it is sent with every request, and it beats whatever is written here.
# "openrouter/auto" always works and is the fallback worth knowing.
#
# This file is baked into the image (see deploy/Dockerfile), so changing the
# line below means a rebuild and a Manual Deploy. The app's own setting does
# not.
default_model = "qwen/qwen3.8-27b:free"
preferred_engine = "openrouter"

[engine]
default = "openrouter"

[agent]
default_agent = "orchestrator"
max_turns = 8
# No shell or filesystem tools *for the server*: a container reachable from the
# internet should not be able to run commands on itself.
#
# The device_* tools are a different thing. They do nothing at all unless a
# phone has linked itself over the bridge (JARVIS_DEVICE_TOKEN), they execute
# on that phone and never here, and the runner on the device decides what it
# will accept. Two of those decisions have to be typed on the phone itself:
# device_shell needs --allow-shell, and the screen tools (tap, swipe, type,
# ui_dump, screenshot) need --allow-ui, because `input tap` can press any
# button on somebody's phone. Without a linked phone every one of them answers
# "nenhum aparelho conectado".
#
# device_permissions is the one to reach for first when a device tool fails for
# no clear reason: Android does not report a denied permission as one.
tools = "think,calculator,web_search,device_open,device_app_launch,device_notify,device_clipboard,device_share,device_status,device_permissions,device_screen_size,device_ui_dump,device_screenshot,device_tap,device_swipe,device_type,device_key,device_photo,device_camera_info,device_write,device_list,device_packages,device_wifi,device_telephony,device_sensors,device_volume,device_contacts,device_location,device_torch_on,device_torch_off,device_shell,device_read,set_display_mode,speak"
context_from_memory = false

[tools.storage]
default_backend = "sqlite"
db_path = "/data/.openjarvis/memory.db"

[learning]
enabled = false

[telemetry]
enabled = false
gpu_metrics = false

[traces]
enabled = true
db_path = "/data/.openjarvis/traces.db"

[server]
host = "0.0.0.0"
port = 8000
