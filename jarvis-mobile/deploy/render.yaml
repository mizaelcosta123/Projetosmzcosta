# Render blueprint for the Jarvis backend.
#
# Apply at:
#   https://dashboard.render.com/blueprint/new
#     ?repo=https://github.com/mizaelcosta123/Projetosmzcosta
#
# Set OPENROUTER_API_KEY in the dashboard after the first deploy — a key in a
# committed file is a key that leaks.
services:
  - type: web
    name: jarvis-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./jarvis-mobile/deploy/Dockerfile
    dockerContext: ./jarvis-mobile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # Render routes to whatever the service listens on; 10000 is its default.
      - key: JARVIS_PORT
        value: "10000"
      - key: JARVIS_HOST
        value: "0.0.0.0"
      - key: OPENROUTER_API_KEY
        sync: false
      # Without a key the server refuses a non-loopback bind, which is the
      # right default for something on the public internet.
      - key: OPENJARVIS_API_KEY
        generateValue: true
    disk:
      name: jarvis-data
      mountPath: /data
      sizeGB: 1
