# For a VPS or a machine on your own network.
#
#   OPENROUTER_API_KEY=... docker compose -f deploy/docker-compose.yml up -d
services:
  jarvis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Loopback only: put a reverse proxy with TLS in front before exposing it.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Set this and the server accepts a non-loopback bind; leave it out and
      # it refuses, which is the behaviour you want by default.
      OPENJARVIS_API_KEY: ${OPENJARVIS_API_KEY:-}
    volumes:
      - jarvis-data:/data
    restart: unless-stopped

volumes:
  jarvis-data:
